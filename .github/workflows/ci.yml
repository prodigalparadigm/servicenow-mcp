name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # setup-uv with python-version already created and activated .venv;
      # install into it. (--system targets the runner's externally managed
      # interpreter and fails; a second `uv venv` collides with this one.)
      - name: Install
        run: uv pip install -e ".[dev]"

      # No credentials and no network reachability are configured here on
      # purpose: if a test needs a live instance, it has to fail in CI.
      - name: Test
        run: .venv/bin/python -m pytest

      - name: Lint
        run: .venv/bin/ruff check . && .venv/bin/ruff format --check .

      - name: Types
        run: .venv/bin/mypy
