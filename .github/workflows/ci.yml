name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv pip install --system -e ".[dev]"

      # No credentials and no network reachability are configured here on
      # purpose: if a test needs a live instance, it has to fail in CI.
      - name: Test
        run: python -m pytest

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Types
        run: mypy
