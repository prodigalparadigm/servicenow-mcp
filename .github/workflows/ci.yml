name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          uv venv --python 3.12
          uv pip install -e ".[dev]"

      # No credentials and no network reachability are configured here on
      # purpose: if a test needs a live instance, it has to fail in CI.
      - name: Test
        run: uv run python -m pytest

      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .

      - name: Types
        run: uv run mypy
