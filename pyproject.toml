[project]
name = "servicenow-mcp"
version = "0.1.0"
description = "A Model Context Protocol server exposing ServiceNow ITSM incidents, assignment groups, and CMDB ownership to LLM clients."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Kathleen Bartin", email = "kathleen@prodigalparadigm.com" }]
keywords = ["mcp", "servicenow", "itsm", "cmdb", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
servicenow-mcp = "servicenow_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/comelyhunger/servicenow-mcp"
Source = "https://github.com/comelyhunger/servicenow-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/servicenow_mcp"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Explicit rather than default so `ruff check` means the same thing for a
# reviewer as it does here.
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplifications
    "ARG",  # unused arguments
    "BLE",  # blind excepts
    "S",    # bandit-style security checks
    "RUF",
]
ignore = [
    "S101",  # asserts are how tests assert
]

[tool.ruff.lint.per-file-ignores]
# The fake instance and the stdio harness deliberately imitate a real server:
# hardcoded localhost binds and fixture passwords are the point.
"tests/*" = ["S104", "S105", "S106", "S107", "S311", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
files = ["src/servicenow_mcp"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:servicenow_mcp.*"]
